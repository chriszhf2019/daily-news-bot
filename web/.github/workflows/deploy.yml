name: Deploy NewsBrief

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: web
        run: npx prisma generate
      
      - name: Build
        working-directory: web
        run: npm run build
      
      - name: Create deployment package
        working-directory: web
        run: |
          tar -czf deploy.tar.gz dist api prisma server package.json package-lock.json .env.example
      
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web/deploy.tar.gz"
          target: "/tmp/"
          strip_components: 1
      
      - name: Setup on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/newsbrief || mkdir -p /var/www/newsbrief && cd /var/www/newsbrief
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            npm ci --production
            npx prisma generate
            npx prisma db push
            sudo systemctl restart newsbrief || true
            echo "✅ Deployment complete"
