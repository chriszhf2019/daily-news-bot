name: 每日新闻推送与测试

on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:
  push:
    branches: [main, feature/*]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: 运行测试
        run: |
          cd backend && DATABASE_URL=sqlite:///:memory: python -m pytest tests/ -v
      - name: 验证管道导入
        run: |
          cd backend && DATABASE_URL=sqlite:///:memory: python -c "from pipeline import SEARCH_QUERIES; print(f'管道配置: {len(SEARCH_QUERIES)} 个搜索查询')"

  daily-news:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行每日新闻推送
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
        run: python app.py
        continue-on-error: true
      - name: 完成提示
        if: always()
        run: |
          echo "✅ GitHub Actions 运行完成"
          echo "📱 请检查微信是否收到新闻简报"
